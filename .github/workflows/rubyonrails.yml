# This workflow will install a prebuilt Ruby version, install dependencies, and run tests.
name: "Ruby on Rails CI"

on:
  push:
  pull_request:
  # Vigia semanal do audit. Uma CVE nova torna o Gemfile.lock vulnerável sem que
  # ninguém mude uma linha, e os outros gatilhos só disparam no push. Neste
  # gatilho roda SÓ o audit (ver os `if` nos jobs): suíte e lint não mudam sem
  # código, e rodá-los aqui gastaria runner para repetir o último resultado.
  schedule:
    - cron: "0 9 * * 1"

# No job writes to the repository contents: only checkout, setup and artifact
# upload. The qlty upload uses secrets.QLTY_COVERAGE_TOKEN; the GitHub coverage
# upload uses the GITHUB_TOKEN, and the code-quality:write it needs is granted
# in that job alone -- it writes coverage data, never the repository.
permissions:
  contents: read

jobs:
  # Checagens que não dependem de navegador nem de banco, num job próprio e em
  # paralelo com a suíte, sem `needs`. Dentro da matriz elas rodavam duas vezes
  # com o mesmo resultado e, pior, um vermelho barato (ofensa de rubocop, CVE
  # nova) abortava os dois jobs antes de `Run tests`: a rodada terminava sem
  # dizer nada sobre a suíte. Separado, cada sinal fica vermelho sozinho, e quem
  # lê o painel sabe qual dos dois é o problema. Encadear com `needs` traria o
  # problema de volta e atrasaria a suíte; portão, se quiser, é branch
  # protection exigindo os dois status (#682).
  checks:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Sem MariaDB aqui, o mysql2 (grupo production) não tem por que compilar;
      # o audit lê o Gemfile.lock inteiro de qualquer forma, grupos incluídos.
      BUNDLE_WITHOUT: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 3

      # O Gemfile não declara piso de segurança (">= x.y.z"): piso envelhece
      # calado quando sai a correção seguinte, e passa a afirmar cobertura que
      # não existe. O que garante que o lock não carrega CVE conhecida é esta
      # checagem, contra a base de advisories baixada na hora. Ela também
      # acusa o rebaixamento silencioso do resolvedor, que era o argumento do
      # piso. É o único passo que roda no gatilho `schedule`.
      - name: Audit
        run: bundle exec bundle-audit check --update

      # O rubocop está no Gemfile desde sempre e nenhum workflow o executava --
      # tanto que ficou quebrado por um bump de gem sem ninguém notar (#644). Com
      # as ofensas em zero, o gate é sustentável.
      - name: Lint
        if: github.event_name != 'schedule'
        run: bundle exec rubocop

      # Mesmo caso do rubocop antes da #644: no Gemfile, em workflow nenhum. Os
      # avisos que sobraram da triagem estão em config/brakeman.ignore, cada um
      # com a nota do porquê; aviso novo, ou aviso conhecido que mudou de forma,
      # fica vermelho aqui. Para rever a lista: `bundle exec brakeman -I`.
      - name: Brakeman
        if: github.event_name != 'schedule'
        run: bundle exec brakeman -q --no-pager

      # O eager load lê colunas pelo active_scaffold ao carregar cada controller,
      # então precisa de esquema; o SQLite do database.yml.example basta. A #680
      # pôs lib/ no eager load, e é esta checagem que acusa se algo ali deixar
      # de carregar -- localmente ela só roda quando alguém lembra.
      - name: Configure database.yml
        if: github.event_name != 'schedule'
        run: cp config/database.yml.example config/database.yml

      - name: Zeitwerk
        if: github.event_name != 'schedule'
        run: bundle exec rake db:schema:load zeitwerk:check

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    # A suite roda nos dois navegadores que a aplicacao encontra: Chrome, que e o
    # da maioria dos usuarios, e Firefox, que e o default local (mais rapido) e o
    # unico que acusa regressao em contorno de bug dele -- o autocomplete="off"
    # nos hidden, que o Rails 8.1 removeu, era um. Os jobs sao independentes:
    # um vermelho nao cancela o outro, para que se saiba se a falha e de um
    # navegador so.
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    name: test (${{ matrix.browser }})

    # Production runs on MariaDB, so CI does too. SQLite stays available for
    # local development (it needs no database server), but the collation there
    # is binary and does not match production; only MariaDB exercises the
    # case- and accent-insensitive semantics (see spec/models/uniqueness_*.rb).
    services:
      mariadb:
        image: mariadb:10.5
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      RAILS_ENV: test
      SELENIUM_BROWSER: ${{ matrix.browser }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # The column collation comes from the CREATE DATABASE below; the
      # connection collation from this URL. Both match production.
      DATABASE_URL: "mysql2://root:root@127.0.0.1:3306/sapos_test?encoding=utf8mb4&collation=utf8mb4_unicode_ci"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # O driver de cada navegador vem pelo Selenium Manager, embutido no
      # selenium-webdriver, que casa a versao com a do navegador instalado.
      - uses: browser-actions/setup-chrome@v2
        if: matrix.browser == 'chrome'
        with:
          install-dependencies: true
          install-chromedriver: false

      - uses: browser-actions/setup-firefox@v1
        if: matrix.browser == 'firefox'

      # Before setup-ruby: the mysql2 gem is a native extension and needs the
      # client development headers to compile during bundle install. The client
      # binary is used further down to create the database.
      - name: Install the MariaDB client and headers
        run: sudo apt-get update && sudo apt-get install -y mariadb-client libmariadb-dev

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 3 # Increment this number if you need to re-download cached gems

      # database.yml is no longer tracked, so provide it from the example. Its
      # test entry is SQLite, but DATABASE_URL above takes precedence and points
      # the connection at MariaDB; the file only needs to exist.
      - name: Configure database.yml
        run: cp config/database.yml.example config/database.yml

      # The collation must match production; utf8mb4_unicode_ci is what the
      # tables materialize there. sql_mode is not set here on purpose: the Rails
      # mysql2 adapter overrides the session sql_mode to its strict default on
      # every connection, in CI and in production alike, so a SET GLOBAL would
      # not change what the app sees.
      - name: Create the test database with production's collation
        run: |
          mysql -h 127.0.0.1 -u root -proot -e "
            CREATE DATABASE sapos_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          "

      - name: Set up database schema
        run: bundle exec rake db:schema:load --trace

      # Audit e Lint moram no job `checks`, acima: aqui só a suíte, para que um
      # vermelho de checagem não esconda o resultado dela.
      #
      # --profile: os dez exemplos mais lentos de cada navegador ficam no log. A
      # matriz mostrou o Firefox 1,5x mais lento que o Chrome no runner (e 2x
      # mais rapido no Mac); so o perfil diz se a diferenca e uniforme, da
      # plataforma, ou concentrada em poucos specs, que e onde se mexe.
      - name: Run tests
        run: |
          set -o pipefail
          bundle exec rspec --profile 10 | tee rspec.log

      # A ordem dos exemplos e sorteada, e a suite ja teve dependencia de ordem
      # (#643). Sem a seed, um vermelho e irreproduzivel; com ela, o
      # `rspec --seed <n> --bisect` isola o exemplo culpado sozinho.
      - name: Registrar a seed
        if: always()
        run: |
          seed=""
          if [ -f rspec.log ]; then
            seed=$(grep -oE 'Randomized with seed [0-9]+' rspec.log | head -1 | grep -oE '[0-9]+$' || true)
          fi
          echo "### Seed do RSpec (${{ matrix.browser }}): \`${seed:-desconhecida}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Reproduzir localmente:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "SELENIUM_BROWSER=${{ matrix.browser }} bundle exec rspec --seed ${seed:-0}" >> "$GITHUB_STEP_SUMMARY"
          echo "SELENIUM_BROWSER=${{ matrix.browser }} bundle exec rspec --seed ${seed:-0} --bisect   # se for dependencia de ordem" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Cobertura sai de um navegador so: as duas rodadas exercitam o mesmo Ruby,
      # e publicar as duas contaria o mesmo codigo duas vezes. O Chrome fica com
      # ela para o historico continuar comparavel com o de antes da matriz.
      - name: Publish code coverage
        if: matrix.browser == 'chrome'
        uses: qltysh/qlty-action/coverage@v1
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage/.resultset.json

      # A cobertura nativa do GitHub roda em paralelo com o qlty durante o
      # periodo de prova. Quando ela tiver produzido dado, o passo do qlty acima,
      # o secret QLTY_COVERAGE_TOKEN e os GitHub Apps do qlty saem juntos.
      #
      # O upload em si e outro job: a acao exige code-quality:write, e este job
      # nao precisa dessa permissao para rodar a suite. PR de fork nao consegue
      # escrever no repositorio base, dai a guarda.
      - name: Upload the Cobertura report
        if: matrix.browser == 'chrome' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-ruby
          path: coverage/coverage.xml

  upload-coverage:
    needs: test
    if: ${{ !cancelled() && needs.test.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      code-quality: write

    steps:
      - name: Download the Cobertura report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report-ruby

      # fail-on-error: false de proposito enquanto durar a prova. A cobertura
      # nativa esta em preview publico e a acao, por padrao, derruba o passo e
      # ainda espera ate 160 s pelo processamento -- uma instabilidade do servico
      # deixaria o CI vermelho sem nada a ver com o codigo. O erro continua
      # aparecendo como anotacao no log.
      - name: Publish code coverage to GitHub
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: Ruby
          label: code-coverage/simplecov
          fail-on-error: false

  smoke-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    env:
      RAILS_ENV: production
      SECRET_KEY_BASE: chave_falsa_apenas_para_o_boot_do_smoke_test
      # The smoke test only boots the app to check sendmail; it never touches the
      # database. Point it at SQLite so it needs no database server.
      DATABASE_URL: "sqlite3:db/smoke_test.sqlite3"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install sendmail
        run: sudo apt-get install -y sendmail

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 2

      - name: Configure database.yml
        run: cp config/database.yml.example config/database.yml

      - name: Run smoke test
        run: bundle exec rake smoke_test:all

  # Os seeds sao o unico lugar que executa o SQL das consultas guardadas:
  # Query#ensure_valid_params e um `validate` que roda a consulta, entao o
  # `save!` do seed a submete ao banco. Migration que renomeia ou derruba coluna
  # quebra aqui e em nenhum outro ponto da suite -- que nunca carrega os seeds.
  #
  # Job separado de proposito: rodar os seeds no banco do job `test` o
  # contaminaria, e a suite passaria a depender de dado de seed.
  #
  # Roda em MariaDB porque e o banco de producao, e porque so nele carrega o
  # bloco atras de `unless is_sqlite` em db/seeds/02.reports_notifications.rb.
  seed:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.5
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      RAILS_ENV: test
      SEED_CHECK_DATABASE_URL: "mysql2://root:root@127.0.0.1:3306/sapos_seed_check?encoding=utf8mb4&collation=utf8mb4_unicode_ci"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install MariaDB client and headers
        run: sudo apt-get update && sudo apt-get install -y mariadb-client libmariadb-dev

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 3

      - name: Configure database.yml
        run: cp config/database.yml.example config/database.yml

      - name: Create the seed-check database with production's collation
        run: |
          mysql -h 127.0.0.1 -u root -proot -e "
            CREATE DATABASE sapos_seed_check CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          "

      - name: Load schema and run seeds
        run: bundle exec rake seeds:check
