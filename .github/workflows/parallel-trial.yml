# EXPERIMENTO DA #741 -- sai do ramo antes do merge, junto com
# .github/parallel_runtime_rspec.log.
#
# Mede a suite no runner com 1 (serial puro), 2 e 4 workers, nos dois
# navegadores, tres vezes cada. Duas perguntas: quanto o paralelo ganha,
# dado que o tempo de uma mesma rodada varia muito de uma VM para outra, e se
# ele produz vermelho intermitente que o serial nao produz. Cada job sorteia a
# sua seed, para amostrar ordens diferentes.
name: "Parallel trial (#741)"

on:
  push:
    branches: [issue_741]

permissions:
  contents: read

jobs:
  parallel:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
        workers: [1, 2, 4]
        trial: [1, 2, 3]
    name: ${{ matrix.browser }}, -n ${{ matrix.workers }}, trial ${{ matrix.trial }}

    services:
      mariadb:
        image: mariadb:10.5
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # Sem DATABASE_URL: ele traz o nome do banco e prevaleceria sobre o
    # database: do YAML, juntando todos os workers num banco so.
    env:
      RAILS_ENV: test
      SELENIUM_BROWSER: ${{ matrix.browser }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # O bin/rspec esta versionado sem bit de execucao, e o parallel_tests o
      # prefere quando existe.
      PARALLEL_TESTS_EXECUTABLE: bundle exec rspec
      # Sem ela, o primeiro boot de teste grava tmp/local_secret.txt, e os N
      # processos do parallel:load_schema num checkout novo correm: um le o
      # arquivo ainda vazio e aborta com `secret_key_base ... got: ""`.
      SECRET_KEY_BASE: chave_falsa_apenas_para_a_suite

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: browser-actions/setup-chrome@v2
        if: matrix.browser == 'chrome'
        with:
          install-dependencies: true
          install-chromedriver: false

      - uses: browser-actions/setup-firefox@v1
        if: matrix.browser == 'firefox'

      - name: Install the MariaDB client and headers
        run: sudo apt-get update && sudo apt-get install -y mariadb-client libmariadb-dev

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 3

      # Um banco por worker: sapos_test, sapos_test2, ... (o primeiro worker
      # tem TEST_ENV_NUMBER vazio). Encoding e collation de producao. Com 1
      # worker sobra so o sapos_test, como no job `test`.
      - name: Configure database.yml
        run: |
          cp config/database.yml.example config/database.yml
          cat >> config/database.yml <<'EOF'

          test:
            adapter: mysql2
            encoding: utf8mb4
            collation: utf8mb4_unicode_ci
            host: 127.0.0.1
            port: 3306
            username: root
            password: root
            database: sapos_test<%= ENV["TEST_ENV_NUMBER"] %>
            pool: 5
          EOF

      - name: Create one test database per worker
        run: |
          for n in "" $(seq 2 ${{ matrix.workers }}); do
            mysql -h 127.0.0.1 -u root -proot -e \
              "CREATE DATABASE sapos_test$n CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          done
          mysql -h 127.0.0.1 -u root -proot -e "SHOW DATABASES LIKE 'sapos_test%';"

      - name: Set up database schemas
        run: bundle exec rake "parallel:load_schema[${{ matrix.workers }}]"

      # Memoria usada do sistema a cada 5 s: no runner so roda este job, entao
      # o total e o custo dos N Rails + N navegadores + MariaDB.
      #
      # A mesma seed vai para todos os workers. Para reproduzir um vermelho do
      # paralelo, rode em serial a lista de arquivos que o
      # --verbose-rerun-command imprime para o worker que falhou, com ela.
      - name: Run tests
        run: |
          set -o pipefail
          seed=$RANDOM
          echo "seed sorteada: $seed"
          (while true; do free -m | awk '/^Mem:/ {print $3}'; sleep 5; done) > mem.log &
          if [ "${{ matrix.workers }}" = 1 ]; then
            bundle exec rspec --seed "$seed" --profile 10 | tee rspec.log
          else
            bundle exec parallel_rspec -n ${{ matrix.workers }} \
              --group-by runtime --runtime-log .github/parallel_runtime_rspec.log \
              --serialize-stdout --combine-stderr --verbose-rerun-command \
              -o "--seed $seed --profile 10 --format documentation --format ParallelTests::RSpec::RuntimeLogger --out tmp/parallel_runtime_rspec.log" \
              spec | tee rspec.log
          fi
          echo "pico de memoria usada (MB): $(sort -n mem.log | tail -n 1)"

      - name: Registrar a contagem e a seed
        if: ${{ !cancelled() }}
        run: |
          if [ "${{ matrix.workers }}" = 1 ]; then
            reproduzir="SELENIUM_BROWSER=${{ matrix.browser }} bundle exec rspec"
          else
            reproduzir="SELENIUM_BROWSER=${{ matrix.browser }} bundle exec rspec <arquivos do worker que falhou, no log>"
          fi
          bash .github/scripts/rspec-summary.sh rspec.log \
            "${{ matrix.browser }}, -n ${{ matrix.workers }}, trial ${{ matrix.trial }}" \
            "$reproduzir"
          echo "- pico de memoria usada: $(sort -n mem.log | tail -n 1) MB" >> "$GITHUB_STEP_SUMMARY"
          grep -E "Line Coverage" rspec.log | tail -n 1 | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallel-${{ matrix.browser }}-n${{ matrix.workers }}-t${{ matrix.trial }}
          path: |
            rspec.log
            mem.log
            tmp/parallel_runtime_rspec.log
