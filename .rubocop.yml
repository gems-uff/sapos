inherit_gem:
  rubocop-rails_config:
    - config/rails.yml

AllCops:
  Exclude:
    # Migration e artefato historico: uma vez aplicada, nao se reescreve. Formatar
    # as antigas so suja o git blame delas, e sao 56 dos 154 arquivos com ofensa.
    # Migration nova sai do gerador do Rails ja no formato dele, nao no nosso.
    - "db/migrate/**/*"
    - "db/schema.rb"
    - "bin/**/*"
    - "vendor/**/*"
    - "node_modules/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/HashSyntax:
  EnforcedShorthandSyntax: either

# Um relogio so: o da aplicacao (config.time_zone), que e o mesmo pelo qual o
# ActiveRecord converte o que le e grava. Time.now, Date.today e Time.parse leem
# o fuso do sistema operacional e so acertam quando ele coincide com o da
# aplicacao (#738). O rubocop-rails_config deixa os dois desligados.
Rails/TimeZone:
  Enabled: true

Rails/Date:
  Enabled: true
