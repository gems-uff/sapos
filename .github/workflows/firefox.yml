# A suite em Firefox, o navegador default local (AGENTS.md). O Chrome roda a
# cada push no rubyonrails.yml; o Firefox, aqui, por disparo manual e uma vez
# por semana sobre a main. Ele e o unico que acusa regressao em contorno de
# bug dele -- o autocomplete="off" nos hidden, que o Rails 8.1 removeu, era um
# --, mas e 1,5x mais lento que o Chrome no runner, e no push ele era a perna
# que segurava o resultado. O disparo manual e para a mudanca que mexe no que
# o navegador executa; o semanal, para a regressao que ninguem pensou em
# disparar.
name: "Firefox"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: test (firefox)
    runs-on: ubuntu-latest

    # Production runs on MariaDB, so CI does too. SQLite stays available for
    # local development (it needs no database server), but the collation there
    # is binary and does not match production; only MariaDB exercises the
    # case- and accent-insensitive semantics (see spec/models/uniqueness_*.rb).
    services:
      mariadb:
        image: mariadb:10.5
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # Os mesmos 4 workers do rubyonrails.yml, numa maquina so: aqui ninguem
    # espera o resultado para integrar.
    env:
      RAILS_ENV: test
      SELENIUM_BROWSER: firefox
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PARALLEL_WORKERS: 4
      # O parallel_tests prefere o bin/rspec, versionado sem bit de execucao.
      PARALLEL_TESTS_EXECUTABLE: bundle exec rspec
      # Ver o mesmo item no rubyonrails.yml.
      SECRET_KEY_BASE: chave_falsa_apenas_para_a_suite

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: browser-actions/setup-firefox@v1

      # Before setup-ruby: the mysql2 gem is a native extension and needs the
      # client development headers to compile during bundle install. The client
      # binary is used further down to create the database.
      - name: Install the MariaDB client and headers
        run: sudo apt-get update && sudo apt-get install -y mariadb-client libmariadb-dev

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 3 # Increment this number if you need to re-download cached gems

      # Um banco por worker: sapos_test, sapos_test2, ... (o primeiro worker tem
      # TEST_ENV_NUMBER vazio). Num banco comum, a varredura de vazamento ao fim
      # de cada arquivo apagaria o before(:all) de outro worker. Nao ha
      # DATABASE_URL: ele traz o nome do banco e prevaleceria sobre o database:
      # daqui, juntando os workers. Sem test_read_only declarado, o cliente
      # proprio do Query.run_read_only_query cai neste mesmo bloco e no banco do
      # worker. A collation da conexao e a de producao.
      - name: Configure database.yml
        run: |
          cat > config/database.yml <<'EOF'
          test:
            adapter: mysql2
            encoding: utf8mb4
            collation: utf8mb4_unicode_ci
            host: 127.0.0.1
            port: 3306
            username: root
            password: root
            database: sapos_test<%= ENV["TEST_ENV_NUMBER"] %>
            pool: 5
          EOF

      # The collation must match production; utf8mb4_unicode_ci is what the
      # tables materialize there. sql_mode is not set here on purpose: the Rails
      # mysql2 adapter overrides the session sql_mode to its strict default on
      # every connection, in CI and in production alike, so a SET GLOBAL would
      # not change what the app sees.
      #
      # --skip-ssl: o cliente da serie 11.4 em diante (o do apt desde a imagem
      # ubuntu-26.04) exige TLS quando a conta tem senha, e o mariadb:10.5 do
      # servico nao oferece TLS. So o cliente de linha de comando: a
      # libmariadb, que o mysql2 usa, conecta sem TLS quando o servidor nao o
      # oferece.
      - name: Create the test databases with production's collation
        run: |
          for n in "" $(seq 2 "$PARALLEL_WORKERS"); do
            mysql --skip-ssl -h 127.0.0.1 -u root -proot -e \
              "CREATE DATABASE sapos_test$n CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          done

      - name: Set up database schemas
        run: bundle exec rake "parallel:load_schema[$PARALLEL_WORKERS]"

      # O tempo de cada arquivo na ultima rodada verde. Sem ele (primeira
      # rodada, ou log cobrindo menos de 2/3 dos arquivos), o parallel_tests
      # cai sozinho para tamanho de arquivo.
      - name: Restore the runtime log
        uses: actions/cache/restore@v4
        with:
          path: tmp/parallel_runtime_rspec.log
          key: parallel-runtime-firefox-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: parallel-runtime-firefox-

      # Ver o mesmo passo no rubyonrails.yml. Uma seed sorteada aqui vai para
      # todos os workers, e e ela que o resumo registra.
      - name: Run tests
        run: |
          set -o pipefail
          seed=$RANDOM
          bundle exec parallel_rspec -n "$PARALLEL_WORKERS" \
            --runtime-log tmp/parallel_runtime_rspec.log \
            --serialize-stdout --combine-stderr --verbose-rerun-command \
            -o "--seed $seed --profile 10 --format documentation --format ParallelTests::RSpec::RuntimeLogger --out tmp/parallel_runtime_rspec.log" \
            spec | tee rspec.log

      # So de rodada verde: um log de rodada cancelada no meio viria truncado.
      - name: Save the runtime log
        if: success()
        uses: actions/cache/save@v4
        with:
          path: tmp/parallel_runtime_rspec.log
          key: parallel-runtime-firefox-${{ github.run_id }}-${{ github.run_attempt }}

      # Contagem, seed e comando de reproducao no resumo do job, e o piso de
      # .github/min-examples (ver rspec-summary.sh).
      - name: Registrar a contagem e a seed
        if: ${{ !cancelled() }}
        run: |
          bash .github/scripts/rspec-summary.sh firefox \
            "SELENIUM_BROWSER=firefox bundle exec rspec" rspec.log
