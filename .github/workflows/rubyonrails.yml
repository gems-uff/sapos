# This workflow will install a prebuilt Ruby version, install dependencies, and run tests.
name: "Ruby on Rails CI"

# Ramo deste repositorio roda pelo push; o pull_request so vale para PR de
# fork, cujo push acontece no fork e nao dispara nada aqui. PR de ramo daqui
# disparava os dois gatilhos e rodava a suite duas vezes sobre o mesmo commit.
# O pull_request nao sai da lista porque o filtro de fork nao existe no
# gatilho: cada job o aplica no `if`, com a condicao repetida (sem ela, o job
# roda). A main nao exige check obrigatorio, entao job pulado ou renomeado
# nao trava merge.
on:
  push:
  pull_request:
  # Vigia semanal do audit. Uma CVE nova torna o Gemfile.lock vulnerável sem que
  # ninguém mude uma linha, e os outros gatilhos só disparam no push. Neste
  # gatilho roda SÓ o audit (ver os `if` nos jobs): suíte e lint não mudam sem
  # código, e rodá-los aqui gastaria runner para repetir o último resultado.
  schedule:
    - cron: "0 9 * * 1"

# No job writes to the repository contents: only checkout, setup and artifact
# upload. The qlty upload uses secrets.QLTY_COVERAGE_TOKEN; the GitHub coverage
# upload uses the GITHUB_TOKEN, and the code-quality:write it needs is granted
# in that job alone -- it writes coverage data, never the repository.
permissions:
  contents: read

jobs:
  # Checagens que não dependem de navegador nem de banco, num job próprio e em
  # paralelo com a suíte, sem `needs`. Dentro da matriz elas rodavam duas vezes
  # com o mesmo resultado e, pior, um vermelho barato (ofensa de rubocop, CVE
  # nova) abortava os dois jobs antes de `Run tests`: a rodada terminava sem
  # dizer nada sobre a suíte. Separado, cada sinal fica vermelho sozinho, e quem
  # lê o painel sabe qual dos dois é o problema. Encadear com `needs` traria o
  # problema de volta e atrasaria a suíte; portão, se quiser, é branch
  # protection exigindo os dois status (#682).
  checks:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Sem MariaDB aqui, o mysql2 (grupo production) não tem por que compilar;
      # o audit lê o Gemfile.lock inteiro de qualquer forma, grupos incluídos.
      BUNDLE_WITHOUT: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 3

      # O Gemfile não declara piso de segurança (">= x.y.z"): piso envelhece
      # calado quando sai a correção seguinte, e passa a afirmar cobertura que
      # não existe. O que garante que o lock não carrega CVE conhecida é esta
      # checagem, contra a base de advisories baixada na hora. Ela também
      # acusa o rebaixamento silencioso do resolvedor, que era o argumento do
      # piso. É o único passo que roda no gatilho `schedule`.
      - name: Audit
        run: bundle exec bundle-audit check --update

      # O rubocop está no Gemfile desde sempre e nenhum workflow o executava --
      # tanto que ficou quebrado por um bump de gem sem ninguém notar (#644). Com
      # as ofensas em zero, o gate é sustentável.
      - name: Lint
        if: github.event_name != 'schedule'
        run: bundle exec rubocop

      # Mesmo caso do rubocop antes da #644: no Gemfile, em workflow nenhum. Os
      # avisos que sobraram da triagem estão em config/brakeman.ignore, cada um
      # com a nota do porquê; aviso novo, ou aviso conhecido que mudou de forma,
      # fica vermelho aqui. Para rever a lista: `bundle exec brakeman -I`.
      - name: Brakeman
        if: github.event_name != 'schedule'
        run: bundle exec brakeman -q --no-pager

      # O node_modules é versionado de propósito (é de lá que o Sprockets tira o
      # CodeMirror, e nenhum guia de instalação pede yarn), mas nada obrigava
      # quem subia a versão no package.json a rodar o yarn install e commitar a
      # pasta -- e ela ficou duas versões atrás do lock sem ninguém notar. Esta
      # checagem não precisa de node, de rede nem de banco: compara o que os
      # quatro arquivos versionados declaram.
      - name: JavaScript
        if: github.event_name != 'schedule'
        run: bundle exec rake javascript:check

      # O eager load lê colunas pelo active_scaffold ao carregar cada controller,
      # então precisa de esquema; o SQLite do database.yml.example basta. A #680
      # pôs lib/ no eager load, e é esta checagem que acusa se algo ali deixar
      # de carregar -- localmente ela só roda quando alguém lembra.
      - name: Configure database.yml
        if: github.event_name != 'schedule'
        run: cp config/database.yml.example config/database.yml

      - name: Zeitwerk
        if: github.event_name != 'schedule'
        run: bundle exec rake db:schema:load zeitwerk:check

      # O guarda de spec/config/schema_dump_spec.rb so roda em SQLite: o arquivo
      # versionado e dump de SQLite, e o de MariaDB acrescenta charset/collation
      # por tabela. O job `test` roda MariaDB, entao la ele nunca executa -- e um
      # schema.rb editado a mao passava batido pelo CI inteiro. Este job ja e
      # SQLite e ja carregou o schema acima; sobra rodar o exemplo.
      - name: Schema dump
        if: github.event_name != 'schedule'
        run: bundle exec rspec spec/config/schema_dump_spec.rb

  # A seed e o log de tempos que as duas maquinas do `test` compartilham. As
  # duas dividem os arquivos com o mesmo algoritmo do parallel_rspec, e so
  # chegam aos mesmos grupos partindo do mesmo log: restaurado em cada
  # maquina, o cache podia trazer entradas diferentes (outra rodada salvando
  # entre as duas restauracoes), e arquivo rodaria nas duas ou em nenhuma.
  # Restaurado uma vez aqui, segue por artefato. O re-run de uma maquina que
  # falhou reaproveita este job, e portanto os grupos e a seed dela.
  test-plan:
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    outputs:
      seed: ${{ steps.seed.outputs.seed }}

    steps:
      # O tempo de cada arquivo na ultima rodada verde. Com ele o parallel_tests
      # divide os arquivos por tempo; sem ele (primeira rodada), por tamanho de
      # arquivo, que equilibra pior mas nao quebra.
      - name: Restore the runtime log
        uses: actions/cache/restore@v4
        with:
          path: tmp/parallel_runtime_rspec.log
          key: parallel-runtime-chrome-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: parallel-runtime-chrome-

      # Uma seed para as duas maquinas, e e ela que os resumos registram.
      - name: Sortear a seed
        id: seed
        run: |
          mkdir -p tmp
          touch tmp/parallel_runtime_rspec.log
          echo "seed=$RANDOM" >> "$GITHUB_OUTPUT"

      - name: Pass the runtime log on
        uses: actions/upload-artifact@v4
        with:
          name: runtime-log-plan
          path: tmp/parallel_runtime_rspec.log
          if-no-files-found: error
          overwrite: true

  test:
    needs: test-plan
    runs-on: ubuntu-latest

    # A suite roda em Chrome, o navegador da maioria dos usuarios, dividida em
    # duas maquinas: o parallel_rspec separa os arquivos em 8 grupos por tempo,
    # e cada maquina roda 4 deles, em 4 workers. Numa maquina so o job levava
    # mais de 20 min. O Firefox, default local, roda no firefox.yml, por
    # disparo manual e toda semana. As maquinas sao independentes: um vermelho
    # nao cancela a outra.
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    name: test (chrome ${{ matrix.part }}/2)

    # Production runs on MariaDB, so CI does too. SQLite stays available for
    # local development (it needs no database server), but the collation there
    # is binary and does not match production; only MariaDB exercises the
    # case- and accent-insensitive semantics (see spec/models/uniqueness_*.rb).
    services:
      mariadb:
        image: mariadb:10.5
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # 4 workers por maquina (#741). Medido no runner, com tres amostras por
    # configuracao: ~2x mais rapido que o serial, e o -n 4 rende mais que o
    # -n 2. No Mac o -n 2 ja satura; por isso o numero aqui nao e o da skill
    # safe-refactor. O serial continua sendo o criterio de pronto local
    # (AGENTS.md).
    env:
      RAILS_ENV: test
      SELENIUM_BROWSER: chrome
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PARALLEL_WORKERS: 4
      # Os grupos da suite inteira: PARALLEL_WORKERS por maquina, nas duas.
      PARALLEL_GROUPS: 8
      # O parallel_tests prefere o bin/rspec, versionado sem bit de execucao.
      PARALLEL_TESTS_EXECUTABLE: bundle exec rspec
      # Sem ela, o primeiro boot de teste grava tmp/local_secret.txt, e os
      # processos simultaneos de um checkout novo correm: um le o arquivo ainda
      # vazio e aborta com `secret_key_base ... got: ""`.
      SECRET_KEY_BASE: chave_falsa_apenas_para_a_suite
      SEED: ${{ needs.test-plan.outputs.seed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # O driver vem pelo Selenium Manager, embutido no selenium-webdriver, que
      # casa a versao com a do navegador instalado.
      - uses: browser-actions/setup-chrome@v2
        with:
          install-dependencies: true
          install-chromedriver: false

      # Before setup-ruby: the mysql2 gem is a native extension and needs the
      # client development headers to compile during bundle install. The client
      # binary is used further down to create the database.
      - name: Install the MariaDB client and headers
        run: sudo apt-get update && sudo apt-get install -y mariadb-client libmariadb-dev

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 3 # Increment this number if you need to re-download cached gems

      # Um banco por worker: sapos_test, sapos_test2, ... (o primeiro worker tem
      # TEST_ENV_NUMBER vazio). Num banco comum, a varredura de vazamento ao fim
      # de cada arquivo apagaria o before(:all) de outro worker. Nao ha
      # DATABASE_URL: ele traz o nome do banco e prevaleceria sobre o database:
      # daqui, juntando os workers. Sem test_read_only declarado, o cliente
      # proprio do Query.run_read_only_query cai neste mesmo bloco e no banco do
      # worker. A collation da conexao e a de producao.
      - name: Configure database.yml
        run: |
          cat > config/database.yml <<'EOF'
          test:
            adapter: mysql2
            encoding: utf8mb4
            collation: utf8mb4_unicode_ci
            host: 127.0.0.1
            port: 3306
            username: root
            password: root
            database: sapos_test<%= ENV["TEST_ENV_NUMBER"] %>
            pool: 5
          EOF

      # The collation must match production; utf8mb4_unicode_ci is what the
      # tables materialize there. sql_mode is not set here on purpose: the Rails
      # mysql2 adapter overrides the session sql_mode to its strict default on
      # every connection, in CI and in production alike, so a SET GLOBAL would
      # not change what the app sees.
      #
      # --skip-ssl: o cliente da serie 11.4 em diante (o do apt desde a imagem
      # ubuntu-26.04) exige TLS quando a conta tem senha, e o mariadb:10.5 do
      # servico nao oferece TLS. So o cliente de linha de comando: a
      # libmariadb, que o mysql2 usa, conecta sem TLS quando o servidor nao o
      # oferece.
      - name: Create the test databases with production's collation
        run: |
          for n in "" $(seq 2 "$PARALLEL_WORKERS"); do
            mysql --skip-ssl -h 127.0.0.1 -u root -proot -e \
              "CREATE DATABASE sapos_test$n CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          done

      - name: Set up database schemas
        run: bundle exec rake "parallel:load_schema[$PARALLEL_WORKERS]"

      - name: Download the runtime log
        uses: actions/download-artifact@v4
        with:
          name: runtime-log-plan
          path: tmp/plan

      # Audit e Lint moram no job `checks`, acima: aqui só a suíte, para que um
      # vermelho de checagem não esconda o resultado dela.
      #
      # --only-group: os grupos desta maquina entre os PARALLEL_GROUPS. Com
      # ele o parallel_tests agrupa por tamanho de arquivo, salvo --group-by
      # explicito; --allowed-missing 100 aceita o arquivo novo sem tempo
      # (entra com a media). Os workers desta maquina usam TEST_ENV_NUMBER
      # vazio, 2, 3 e 4, os bancos criados acima.
      #
      # --profile: os dez exemplos mais lentos ficam no log, um perfil por
      # worker. O --format documentation e repetido porque um --format em -o
      # substitui o do .rspec, e a saida perderia a linha de contagem. O
      # --verbose-rerun-command imprime o comando de cada worker que falhar,
      # que o resumo transcreve para a reproducao. O RuntimeLogger grava o
      # tempo dos arquivos desta maquina; o job `test-summary` junta as duas.
      - name: Run tests
        run: |
          set -o pipefail
          if [ "${{ matrix.part }}" = 1 ]; then grupos=1,2,3,4; else grupos=5,6,7,8; fi
          if [ -s tmp/plan/parallel_runtime_rspec.log ]; then
            agrupar="--group-by runtime --allowed-missing 100 --runtime-log tmp/plan/parallel_runtime_rspec.log"
          else
            agrupar="--group-by filesize"
          fi
          bundle exec parallel_rspec -n "$PARALLEL_GROUPS" --only-group "$grupos" $agrupar \
            --serialize-stdout --combine-stderr --verbose-rerun-command \
            -o "--seed $SEED --profile 10 --format documentation --format ParallelTests::RSpec::RuntimeLogger --out tmp/parallel_runtime_rspec.log" \
            spec | tee rspec.log

      # Contagem, seed e comando de reproducao no resumo do job. A ordem dos
      # exemplos e sorteada, e a suite ja teve dependencia de ordem (#643): sem
      # a seed, um vermelho e irreproduzivel. O piso de exemplos e conferido
      # na soma das duas maquinas, no `test-summary`.
      - name: Registrar a contagem e a seed
        if: ${{ !cancelled() }}
        env:
          SEM_PISO: 1
        run: |
          bash .github/scripts/rspec-summary.sh "chrome ${{ matrix.part }}/2" \
            "SELENIUM_BROWSER=chrome bundle exec rspec" rspec.log

      # O .resultset.json, e nao o coverage.xml: o desta maquina cobre so a
      # parte dela, e e o resultset que se junta. Comeca com ponto, e o
      # upload-artifact deixa de fora arquivo oculto sem include-hidden-files.
      - name: Pass the results on
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: test-chrome-${{ matrix.part }}
          path: |
            rspec.log
            tmp/parallel_runtime_rspec.log
            coverage/.resultset.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true

  # O que so a rodada inteira diz: o piso de exemplos, a cobertura e o log de
  # tempos da proxima rodada, somando as duas maquinas.
  test-summary:
    needs: test
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      # Sem banco aqui: so o simplecov roda, e o mysql2 nao tem por que
      # compilar.
      BUNDLE_WITHOUT: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 3

      - name: Download the results
        uses: actions/download-artifact@v4
        with:
          pattern: test-chrome-*
          path: partes

      # Arquivo que rodou nas duas maquinas quer dizer que elas chegaram a
      # grupos diferentes, e algum outro nao rodou em nenhuma: a soma de
      # exemplos podia ate passar do piso. O log de tempos de cada maquina
      # tem uma linha por arquivo que ela rodou.
      - name: Registrar a contagem e a seed
        run: |
          repetidos=$(cat partes/*/tmp/parallel_runtime_rspec.log | sed 's/:[^:]*$//' | sort | uniq -d)
          if [ -n "$repetidos" ]; then
            echo "::error title=RSpec (chrome)::arquivos rodados nas duas maquinas: $repetidos"
            exit 1
          fi
          bash .github/scripts/rspec-summary.sh "chrome, as duas maquinas" \
            "SELENIUM_BROWSER=chrome bundle exec rspec" partes/*/rspec.log

      - name: Join the runtime logs
        run: |
          mkdir -p tmp
          cat partes/*/tmp/parallel_runtime_rspec.log > tmp/parallel_runtime_rspec.log

      # So de rodada verde: um log de rodada cancelada no meio viria truncado.
      - name: Save the runtime log
        uses: actions/cache/save@v4
        with:
          path: tmp/parallel_runtime_rspec.log
          key: parallel-runtime-chrome-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Join the coverage
        run: bundle exec ruby .github/scripts/collate-coverage.rb partes/*/coverage/.resultset.json

      - name: Publish code coverage
        uses: qltysh/qlty-action/coverage@v1
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage/coverage.xml

      # A cobertura nativa do GitHub roda em paralelo com o qlty durante o
      # periodo de prova. Quando ela tiver produzido dado, o passo do qlty acima,
      # o secret QLTY_COVERAGE_TOKEN e os GitHub Apps do qlty saem juntos.
      #
      # O upload em si e outro job: a acao exige code-quality:write, e este job
      # nao precisa dessa permissao. PR de fork nao consegue escrever no
      # repositorio base, dai a guarda.
      - name: Upload the Cobertura report
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-ruby
          path: coverage/coverage.xml
          overwrite: true

  upload-coverage:
    needs: test-summary
    if: ${{ !cancelled() && needs.test-summary.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write

    steps:
      - name: Download the Cobertura report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report-ruby

      # fail-on-error: false de proposito enquanto durar a prova. A cobertura
      # nativa esta em preview publico e a acao, por padrao, derruba o passo e
      # ainda espera ate 160 s pelo processamento -- uma instabilidade do servico
      # deixaria o CI vermelho sem nada a ver com o codigo. O erro continua
      # aparecendo como anotacao no log.
      - name: Publish code coverage to GitHub
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: Ruby
          label: code-coverage/simplecov
          fail-on-error: false
  smoke-test:
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest

    env:
      RAILS_ENV: production
      SECRET_KEY_BASE: chave_falsa_apenas_para_o_boot_do_smoke_test
      # The smoke test only boots the app to check sendmail; it never touches the
      # database. Point it at SQLite so it needs no database server.
      DATABASE_URL: "sqlite3:db/smoke_test.sqlite3"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install sendmail
        run: sudo apt-get install -y sendmail

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 2

      - name: Configure database.yml
        run: cp config/database.yml.example config/database.yml

      - name: Run smoke test
        run: bundle exec rake smoke_test:all

  # Os seeds sao o unico lugar que executa o SQL das consultas guardadas:
  # Query#ensure_valid_params e um `validate` que roda a consulta, entao o
  # `save!` do seed a submete ao banco. Migration que renomeia ou derruba coluna
  # quebra aqui e em nenhum outro ponto da suite -- que nunca carrega os seeds.
  #
  # Job separado de proposito: rodar os seeds no banco do job `test` o
  # contaminaria, e a suite passaria a depender de dado de seed.
  #
  # Roda em MariaDB porque e o banco de producao, e porque so nele carrega o
  # bloco atras de `unless is_sqlite` em db/seeds/02.reports_notifications.rb.
  seed:
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.5
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      RAILS_ENV: test
      SEED_CHECK_DATABASE_URL: "mysql2://root:root@127.0.0.1:3306/sapos_seed_check?encoding=utf8mb4&collation=utf8mb4_unicode_ci"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install MariaDB client and headers
        run: sudo apt-get update && sudo apt-get install -y mariadb-client libmariadb-dev

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 3

      - name: Configure database.yml
        run: cp config/database.yml.example config/database.yml

      # --skip-ssl: ver o mesmo passo no job test.
      - name: Create the seed-check database with production's collation
        run: |
          mysql --skip-ssl -h 127.0.0.1 -u root -proot -e "
            CREATE DATABASE sapos_seed_check CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          "

      - name: Load schema and run seeds
        run: bundle exec rake seeds:check
