# EXPERIMENTO DA #741 -- sai do ramo antes do merge, junto com
# .github/parallel_runtime_rspec.log.
#
# Mede a suite com parallel_rspec no runner, nos dois navegadores, com 2 e 4
# workers. A base serial e o job `test` do rubyonrails.yml, que roda no mesmo
# push e no mesmo commit.
name: "Parallel trial (#741)"

on:
  push:
    branches: [issue_741]

permissions:
  contents: read

jobs:
  parallel:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
        workers: [2, 4]
    name: parallel (${{ matrix.browser }}, -n ${{ matrix.workers }})

    services:
      mariadb:
        image: mariadb:10.5
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # Sem DATABASE_URL: ele traz o nome do banco e prevaleceria sobre o
    # database: do YAML, juntando todos os workers num banco so.
    env:
      RAILS_ENV: test
      SELENIUM_BROWSER: ${{ matrix.browser }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # O bin/rspec esta versionado sem bit de execucao, e o parallel_tests o
      # prefere quando existe.
      PARALLEL_TESTS_EXECUTABLE: bundle exec rspec

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: browser-actions/setup-chrome@v2
        if: matrix.browser == 'chrome'
        with:
          install-dependencies: true
          install-chromedriver: false

      - uses: browser-actions/setup-firefox@v1
        if: matrix.browser == 'firefox'

      - name: Install the MariaDB client and headers
        run: sudo apt-get update && sudo apt-get install -y mariadb-client libmariadb-dev

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 3

      # Um banco por worker: sapos_test, sapos_test2, ... (o primeiro worker
      # tem TEST_ENV_NUMBER vazio). Encoding e collation de producao.
      - name: Configure database.yml
        run: |
          cp config/database.yml.example config/database.yml
          cat >> config/database.yml <<'EOF'

          test:
            adapter: mysql2
            encoding: utf8mb4
            collation: utf8mb4_unicode_ci
            host: 127.0.0.1
            port: 3306
            username: root
            password: root
            database: sapos_test<%= ENV["TEST_ENV_NUMBER"] %>
            pool: 5
          EOF

      - name: Create one test database per worker
        run: |
          for n in "" $(seq 2 ${{ matrix.workers }}); do
            mysql -h 127.0.0.1 -u root -proot -e \
              "CREATE DATABASE sapos_test$n CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          done
          mysql -h 127.0.0.1 -u root -proot -e "SHOW DATABASES LIKE 'sapos_test%';"

      - name: Set up database schemas
        run: bundle exec rake "parallel:load_schema[${{ matrix.workers }}]"

      # Memoria usada do sistema a cada 5 s: no runner so roda este job, entao
      # o total e o custo dos N Rails + N navegadores + MariaDB.
      - name: Run tests
        run: |
          set -o pipefail
          nproc
          (while true; do free -m | awk '/^Mem:/ {print $3}'; sleep 5; done) > mem.log &
          bundle exec parallel_rspec -n ${{ matrix.workers }} \
            --group-by runtime --runtime-log .github/parallel_runtime_rspec.log \
            --serialize-stdout --combine-stderr --verbose-rerun-command \
            -o '--seed 25741 --profile 10 --format documentation --format ParallelTests::RSpec::RuntimeLogger --out tmp/parallel_runtime_rspec.log' \
            spec | tee rspec.log
          echo "pico de memoria usada (MB): $(sort -n mem.log | tail -n 1)"

      - name: Registrar a contagem e a seed
        if: ${{ !cancelled() }}
        run: |
          bash .github/scripts/rspec-summary.sh rspec.log \
            "${{ matrix.browser }}, -n ${{ matrix.workers }}" \
            "parallel_rspec -n ${{ matrix.workers }} (comando por worker no log)"
          echo "- pico de memoria usada: $(sort -n mem.log | tail -n 1) MB" >> "$GITHUB_STEP_SUMMARY"
          grep -E "Line Coverage" rspec.log | tail -n 1 | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallel-${{ matrix.browser }}-n${{ matrix.workers }}
          path: |
            rspec.log
            mem.log
            tmp/parallel_runtime_rspec.log
